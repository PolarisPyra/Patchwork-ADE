[package]
name = "patchwork"
version = "0.1.0"
description = "Patchwork — an agentic development environment"
edition = "2024"
rust-version = "1.90"

[lib]
name = "patchwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
patchwork-server = { path = "../../server" }
