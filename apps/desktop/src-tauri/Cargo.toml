[package]
name = "patchwork"
version = "0.4.10"
description = "Patchwork — an agentic development environment"
edition = "2024"
rust-version = "1.90"

[lib]
name = "patchwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
patchwork-server = { path = "../../server" }
notify = "8"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
glib = "0.18"
