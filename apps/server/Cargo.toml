[package]
name = "patchwork-server"
version = "0.1.0"
description = "Patchwork backend: providers, persistence, usage, and thread import"
edition = "2024"
rust-version = "1.90"

[dependencies]
serde_json = "1.0"
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
which = "7"
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
