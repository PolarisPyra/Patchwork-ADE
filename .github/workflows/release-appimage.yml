name: Release AppImage

# Builds the Linux AppImage when a version tag (v0.1.0, v0.2.0, ...) is pushed,
# and attaches it to a GitHub release for that tag. Pushes to main don't build.
# Run it by hand from the Actions tab to build without a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Build on the oldest Ubuntu runner still available so the AppImage links
    # against an older glibc and runs on newer distributions too.
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy is itself an AppImage; this lets it run without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
        with:
          # git-cliff needs the full history and tags to build the release notes.
          fetch-depth: 0

      - name: Install Tauri Linux dependencies
        # Prebuilt Ubuntu packages, kept in the Actions cache: the WebKitGTK ones are large, and a
        # slow Ubuntu mirror once held a release at this step for over 15 minutes. Change `version`
        # to refresh the cached packages.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: >-
            build-essential file libayatana-appindicator3-dev libfuse2 librsvg2-dev libssl-dev
            libwebkit2gtk-4.1-dev libxdo-dev patchelf
          version: 1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set version from tag
        # The tag is the source of truth. Local builds keep the placeholder version in these files.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in package.json apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json; do
            jq --arg v "$version" '.version = $v' "$file" > "$file.tmp" && mv "$file.tmp" "$file"
          done
          for file in apps/desktop/src-tauri/Cargo.toml apps/server/Cargo.toml; do
            sed -i "0,/^version = /{s/^version = .*/version = \"$version\"/}" "$file"
          done

      - name: Build AppImage
        run: scripts/build.sh appimage

      - name: Find AppImage
        id: find
        run: |
          path=$(ls target/release/bundle/appimage/*.AppImage | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        # The release below attaches the AppImage itself, so a full artifact store
        # shouldn't fail the run.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: patchwork-appimage
          path: ${{ steps.find.outputs.path }}

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output RELEASE_NOTES.md

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.find.outputs.path }}" \
            --title "Patchwork $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
